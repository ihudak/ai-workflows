# The plugin family's session-cost price table. USD per MILLION tokens, keyed by model id.
# Rates sourced from https://platform.claude.com/docs/en/about-claude/pricing (standard
# first-party Claude API, Sonnet/Opus/Haiku/Fable re-verified live 2026-09-02; Opus 5.5 added from the
# same page 2026-09-23; Fable 5.1 and Sonnet 5.5 keys, and the fast-mode and data-residency
# rules, taken from it 2026-09-30). The Batch discount is NOT applied: an interactive session
# is never a batch.
#
# FAST MODE AND DATA RESIDENCY are priced, because the transcript records both and they change
# the RATE, not the token count. Every assistant message carries `usage.speed` (`standard` |
# `fast`) and `usage.inference_geo` (`global` | `us` | `not_available`); the engine buckets
# tokens by that pair and prices each bucket at its own rate.
#
#   * FAST MODE is a per-model `fast:` sub-block, keyed explicitly like every other rate here.
#     It exists on Opus 5.5 ($8/$40) and on Opus 5 and Opus 4.8 ($10/$50) -- 2x their standard
#     rates. Opus 4.7 rejects `speed: "fast"` outright, so it has no block; Opus 4.6 accepts
#     it but runs and bills at standard, so its block repeats the standard rates. "Prompt caching multipliers apply on top of
#     fast mode pricing", so a fast block's cache rates are the model's own multipliers applied
#     to its FAST input price -- Opus 5.5's cache read is 0.05 x $8, not 0.05 x $4. A `fast`
#     record on a model with no `fast:` block is reported `unpriced-speed:fast` with a null
#     cost. It is deliberately NOT priced at the standard rate: that figure would be confident
#     and known to be low by half.
#   * DATA RESIDENCY is `modifiers.inference_geo` below: US-only inference bills 1.1x "on all
#     token pricing categories, including input tokens, output tokens, cache writes, and cache
#     reads", on Claude 4.6 and later, and it stacks on top of fast mode. `global`,
#     `not_available` and an absent field are the standard case and need no entry -- which is
#     what keeps a price file written before this map existed pricing correctly. A geo value
#     with no entry is reported `unpriced-inference-geo:<value>`, null cost.
#
# This file used to say these modifiers were "NOT applied (interactive Claude Code sessions
# bill at standard rates)". That premise was false the moment a session used /fast, and the
# error ran one way only: a fast Opus 5.5 turn priced 50% low. No entry written before then is
# wrong -- every record observed locally was `standard` + `global` / `not_available`.
#
# PERMANENT (standard) rates only -- never promotional/introductory rates. Cost figures
# must stay comparable across PRDs over time, so a rate that is advertised as temporary is
# not keyed here while it is temporary.
#
# Sonnet 5 was keyed at $3/$15 on exactly that reasoning, because $2/$10 was introductory
# "through 2026-08-31". The window closed and the rate did not move: the published rate on
# 2026-09-02 is still $2/$10, so it is the standard rate and is keyed as such. The hedge
# was right to make and wrong to keep -- a table that bills at a rate nobody charges is not
# comparable to anything, it is just wrong in one direction. Comparability across PRDs is
# served by recording WHEN a rate changed, which this comment now does, not by declining to
# follow it.
#
# Keys cover every model the plugin's routing policy can reach: the Opus chain (§2) and
# the Sonnet chain (§2.1: claude-sonnet-5-5 -> 5 -> 4-6 -> 4-5) -- plus Opus 4.5, Mythos,
# Fable and Haiku, which no chain names but a session or an enforced model may run on.
# The engine exact-matches first, then falls back to the longest table key that is a prefix of the
# model id, so a dated id (claude-sonnet-5-20250930, claude-haiku-4-5-20251001) prices
# off its undated base key automatically.
#
# Override without editing this file: set $DEV_WORKFLOWS_COST_PRICES to a path, or
# drop a repo-local cost-prices.yaml. Cache multipliers follow Anthropic's model
# (cache_read = input * 0.1, cache_write_5m = input * 1.25, cache_write_1h = input * 2.0),
# except Opus 5.5, whose cache reads bill at input * 0.05, and Fable 5.1, whose bill at
# input * 0.025 -- which is why every rate below is keyed explicitly rather than derived
# from `input`.
models:
  # Opus chain (§2). Opus 5.5 bills at $4 / $20 with cache reads at 0.05x ($0.20);
  # Opus 5 and Opus 4.6-4.8 all bill at $5 / $25.
  # claude-opus-5-5 MUST stay keyed: `claude-opus-5` is a prefix of it, so without its
  # own key the prefix fallback prices every Opus 5.5 turn at Opus 5's rates.
  claude-opus-5-5:
    input: 4.0
    output: 20.0
    cache_read: 0.2
    cache_write_5m: 5.0
    cache_write_1h: 8.0
    fast:                   # usage.speed == "fast": $8 / $40, cache multipliers on the FAST input
      input: 8.0
      output: 40.0
      cache_read: 0.4       # 0.05 x 8.0 -- Opus 5.5's own cache-read multiplier, not 0.1
      cache_write_5m: 10.0
      cache_write_1h: 16.0
  claude-opus-5:
    input: 5.0
    output: 25.0
    cache_read: 0.5
    cache_write_5m: 6.25
    cache_write_1h: 10.0
    fast:                   # usage.speed == "fast": $10 / $50
      input: 10.0
      output: 50.0
      cache_read: 1.0
      cache_write_5m: 12.5
      cache_write_1h: 20.0
  claude-opus-4-8:
    input: 5.0
    output: 25.0
    cache_read: 0.5
    cache_write_5m: 6.25
    cache_write_1h: 10.0
    fast:                   # usage.speed == "fast": $10 / $50
      input: 10.0
      output: 50.0
      cache_read: 1.0
      cache_write_5m: 12.5
      cache_write_1h: 20.0
  claude-opus-4-7:
    input: 5.0
    output: 25.0
    cache_read: 0.5
    cache_write_5m: 6.25
    cache_write_1h: 10.0
  claude-opus-4-6:
    input: 5.0
    output: 25.0
    cache_read: 0.5
    cache_write_5m: 6.25
    cache_write_1h: 10.0
    fast:                   # usage.speed == "fast" runs and bills at STANDARD here (pricing page)
      input: 5.0
      output: 25.0
      cache_read: 0.5
      cache_write_5m: 6.25
      cache_write_1h: 10.0
  # Opus 4.5 is outside the §2 chain, but a session can run on it by hand, and pricing keys
  # off the model id the transcript records. No other key prefixes `claude-opus-4-5`, so
  # without this entry such a run prices `unpriced-model`. It predates US-only inference
  # (Claude 4.6 and later), so a `us` record on it is not expected.
  claude-opus-4-5:
    input: 5.0
    output: 25.0
    cache_read: 0.5
    cache_write_5m: 6.25
    cache_write_1h: 10.0
  # Sonnet chain (§2.1). Sonnet 5.5 and Sonnet 5 both bill at $2 / $10 (see the header);
  # Sonnet 4.5/4.6 remain at $3 / $15.
  # claude-sonnet-5-5 is keyed explicitly even though its rates currently equal Sonnet 5's,
  # because `claude-sonnet-5` is a strict PREFIX of it. Without its own key the table is
  # correct only by coincidence, and the day either model is repriced that silently becomes
  # a wrong figure with no `unpriced-model` note -- exactly what claude-opus-5-5 did against
  # claude-opus-5 until 1.7.5. Two models at one rate is not a reason to share one key.
  claude-sonnet-5-5:
    input: 2.0
    output: 10.0
    cache_read: 0.2
    cache_write_5m: 2.5
    cache_write_1h: 4.0
  claude-sonnet-5:
    input: 2.0
    output: 10.0
    cache_read: 0.2
    cache_write_5m: 2.5
    cache_write_1h: 4.0
  claude-sonnet-4-6:
    input: 3.0
    output: 15.0
    cache_read: 0.3
    cache_write_5m: 3.75
    cache_write_1h: 6.0
  claude-sonnet-4-5:
    input: 3.0
    output: 15.0
    cache_read: 0.3
    cache_write_5m: 3.75
    cache_write_1h: 6.0
  # Fable. Not reachable by the routing policy (§2/§2.1 never select it), but a session may
  # RUN on it, and an unpriced session records tokens with a null cost. Two traps, both
  # load-bearing:
  #   1. Fable 5.1 reads cache at 0.025x input ($0.25), not the 0.1x every other model here
  #      uses. Anthropic states it as a per-model exception on the pricing page.
  #   2. `claude-fable-5` is a strict PREFIX of `claude-fable-5-1`, so dropping the 5.1 key
  #      does not yield "no price" -- longest-prefix fallback silently prices 5.1's cache
  #      reads at Fable 5's $1, 4x high, on the token class that dominates a cached agentic
  #      session. Both keys must stay, and stay separate. This comment used to assert the
  #      opposite ("the longest-prefix rule prices both from this one entry"), which is true
  #      of input/output and false of cache_read -- the field that matters most here.
  claude-mythos-5-1:
    input: 10.0
    output: 50.0
    cache_read: 0.25
    cache_write_5m: 12.5
    cache_write_1h: 20.0
  claude-mythos-5:
    input: 10.0
    output: 50.0
    cache_read: 1.0
    cache_write_5m: 12.5
    cache_write_1h: 20.0
  # ^ Mythos (limited availability, invitation only). Priced identically to the Fable pair
  #   below and keyed for the same reason and with the SAME trap: `claude-mythos-5` is a
  #   strict prefix of `claude-mythos-5-1`, and 5.1's cache reads are 0.025x input where 5's
  #   are 0.1x.
  claude-fable-5-1:
    input: 10.0
    output: 50.0
    cache_read: 0.25
    cache_write_5m: 12.5
    cache_write_1h: 20.0
  claude-fable-5:
    input: 10.0
    output: 50.0
    cache_read: 1.0
    cache_write_5m: 12.5
    cache_write_1h: 20.0
  # Haiku. No classification.md chain names it (defect-reporter runs on §2.1), but a
  # session or an --enforce-model value may run on it.
  claude-haiku-4-5:
    input: 1.0
    output: 5.0
    cache_read: 0.1
    cache_write_5m: 1.25
    cache_write_1h: 2.0
# Rate multipliers that apply across every token category of a record. Only NON-default
# values are listed: `global`, `not_available` and an absent field bill at 1.0 by
# definition and are never looked up here.
modifiers:
  inference_geo:
    us: 1.1                 # US-only inference, Claude 4.6 and later; stacks on fast mode
default: null             # unknown model -> unpriced (tokens recorded, cost null)
