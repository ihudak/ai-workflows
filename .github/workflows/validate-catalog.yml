name: Validate plugin catalog

# Guards the marketplace catalog and every plugin manifest in this repository.
#
# The failure this exists to prevent: GitHub Copilot CLI rejects a marketplace
# whose plugins[i].description exceeds 1024 characters, and it rejects the
# entire catalog -- so one over-long blurb makes EVERY plugin in the
# marketplace fail to install or update. Claude Code enforces no such limit,
# which is precisely why it kept shipping: the Claude editions grew past the
# limit with no local symptom, and the Copilot edition inherited the overflow
# at port time.
#
# Runs on push and pull request so a bad catalog is caught before anyone's
# `plugin update` fetches it.
#
# The same job also runs scripts/check-id-grammar.sh, the requirement-ID grammar
# gate: every ID a plugin doc teaches must be the Jira-safe bracketed [PREFIX#N]
# form, never the dash form that Jira auto-links to an unrelated ticket on paste.
# It is here rather than in a hook because a gate whose enforcement lives only in
# someone's memory is how the description-length rule regressed three times.
#
# It also runs scripts/check-docs.sh, which guards each plugin named in its
# PLUGIN_RELS list -- read the list from that script's own definition rather
# than from a copy here, which went stale across two increments of the
# marketplace split before anyone noticed -- against drift from its own shipped tree (links/anchors, orphan
# pages, command/agent/reference/hook inventories in both directions, env-var
# docs, table-cell width, and the getting-started.md install-block /
# identity-quarantine pin). Its command inventory also gates the namespace
# manifest session-cost.py resolves cost boundaries against, over every plugin in
# the tree rather than only the listed ones -- that file has no reader that would
# notice it going stale, and a missing entry silently mis-attributes spend. Each
# gate's --selftest runs immediately before its --root check, in the same order: a
# gate that has stopped being able to fail must turn the build red, not green.
#
# It also runs scripts/mermaid/check-mermaid.mjs, which finds every ```mermaid block in
# every tracked markdown file with a real CommonMark lexer and parses it with mermaid's
# own parser. GitHub draws those fences as diagrams and shows "Unable to render rich
# display" where one does not parse, and nothing else here parsed mermaid (check-docs.sh
# check 15 reads diagrams only for which commands they name) -- so
# plugins/product-workflows/docs/workflow.md
# shipped from product-workflows 3.0.0 onward with five unquoted edge labels that no
# gate saw, and a person found it by opening the page. The parser is pinned by exact
# version and a committed lockfile, as is the lexer, and both are installed with
# --ignore-scripts, so neither can change under the gate between two runs nor execute
# code when it installs.
#
# Finally it self-tests session-cost.py's window splitter. That script is the only
# executable code the family ships, and the splitter's failure mode is silent: a
# command boundary that is missed or invented still produces a plausible dollar
# figure, filed against the wrong phase. Its fixtures are built to discriminate,
# each against the broken implementation it exists to catch: an unanchored marker
# match, one that skips the known-command set, and -- since the split spread the
# family across plugins -- one that widens the accepted namespaces without
# widening the per-namespace command sets, which passes both safety cases and
# reports 9000 claimed tokens where 5000 is correct. No count is written here:
# they move whenever the fixture grows, and the assertions carry their own.

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: scripts/mermaid/package-lock.json

      - name: Self-test the catalog validator
        run: python3 scripts/validate-catalog.py --selftest

      - name: Validate manifests and catalog
        run: python3 scripts/validate-catalog.py

      - name: Self-test the requirement-ID gate
        run: ./scripts/check-id-grammar.sh --selftest

      - name: Check requirement-ID grammar
        run: ./scripts/check-id-grammar.sh --root .

      - name: Self-test the docs gate
        run: ./scripts/check-docs.sh --selftest

      - name: Check docs against the plugin tree
        # ASSERT_PUBLISHED arms check 18 -- the one check that must NOT run everywhere. A
        # changelog section headed `— Unreleased` is the correct authoring state on a feature
        # branch and a false claim on the default branch, because `claude plugin update` fetches
        # from there: whatever is on main is what users install. So it is armed exactly where the
        # claim is false, and a release branch stays green while it is still being written.
        # `github.ref` is the branch being pushed; on a pull_request event it is the merge ref,
        # never `refs/heads/main`, so the gate arms on the push that publishes and not on the
        # review that precedes it.
        env:
          ASSERT_PUBLISHED: ${{ github.ref == 'refs/heads/main' && '1' || '' }}
        run: ./scripts/check-docs.sh --root .

      - name: Install the mermaid gate's pinned parser
        run: npm ci --prefix scripts/mermaid --ignore-scripts --no-audit --no-fund
      - name: Self-test the mermaid gate
        run: node scripts/mermaid/check-mermaid.mjs --selftest
      - name: Check every mermaid diagram parses
        run: node scripts/mermaid/check-mermaid.mjs --root .
      - name: Self-test the session-cost window splitter
        # Discovered, not hardcoded: the cost subsystem moves between plugins as the
        # marketplace is split, and a hardcoded path would either 404 the step or --
        # worse -- keep self-testing a stale copy left behind at the old location.
        # Exactly one match is required, so both a move and an accidental duplicate
        # fail loudly here rather than silently changing what is tested.
        run: |
          mapfile -t hits < <(find plugins -type f -name session-cost.py | sort)
          if [ "${#hits[@]}" -ne 1 ]; then
            echo "expected exactly one session-cost.py under plugins/, found ${#hits[@]}:" >&2
            printf '  %s\n' "${hits[@]}" >&2
            exit 1
          fi
          python3 "${hits[0]}" --selftest

      - name: Self-test the secret scan
        # code-handoff.md runs it before every code commit. Its failure mode is silent: a
        # rule that stopped matching reports a clean diff, and a mask that stopped masking
        # prints the secret it found. Its fixtures are assembled at run time in a temporary
        # repository, so no token-shaped literal sits in this repo for push protection to
        # trip on.
        run: python3 plugins/dev-workflows/scripts/secret-scan.py --selftest

      - name: Self-test the architecture harvest
        # /product-workflows:harvest-decisions writes the team knowledge base with it. Its
        # failure mode is silent: a rule that stopped matching harvests nothing, or a
        # non-idempotent render re-proposes every record on every run. Fixtures are built
        # at run time.
        run: python3 plugins/product-workflows/scripts/architecture-harvest.py --selftest

      - name: Self-test the promotion signals
        # /product-workflows:promote-decisions reads its signals and writes the promotion keys with
        # it. Its failure modes are silent: a missed citation shortlists the wrong records, and a
        # --mark that moves a byte makes the next harvest rewrite every marked record.
        run: python3 plugins/product-workflows/scripts/promotion-signals.py --selftest

      - name: Self-test the proposal record
        # /product-workflows:prd-proposal and /brd-proposal record, stamp and compare with it which
        # version of each input a proposal priced. Its failure modes are silent: a missed input reads a
        # stale proposal as current, and a stamp that moves a byte rewrites a customer's document.
        # Fixtures are built at run time.
        run: python3 plugins/product-workflows/scripts/proposal-record.py --selftest

      - name: Self-test the session branch
        # specs-repo-git §8 commits, merges and lifts session files with it on a specs
        # repository whose default branch takes no push. Its failure mode loses entries: a
        # merge that drops a teammate's appended line, or a lift that discards a file not
        # yet on the session branch. Fixtures are built at run time, with a bare remote
        # that refuses its default branch.
        run: python3 plugins/workflows-core/scripts/session-branch.py --selftest
